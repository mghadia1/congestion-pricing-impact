[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "congestion-pricing-impact"
version = "0.1.0"
description = "Difference-in-differences study of NYC congestion pricing (5 Jan 2025) on yellow-taxi trips and speeds"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=16",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
congestion = "congestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
congestion = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
